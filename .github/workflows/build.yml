name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTEXT: 8.4/trixie/fpm
  VARIANT: fpm-trixie
  PLATFORM: linux/amd64

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      php_version: ${{ steps.version.outputs.php_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        run: |
          v="$(awk '$1 == "ENV" && $2 == "PHP_VERSION" { print $3 }' "$CONTEXT/Dockerfile")"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a final release version: $v"; exit 1; }
          echo "php_version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: ${{ env.PLATFORM }}
          load: true
          tags: local/php:test
          cache-from: type=gha,scope=${{ env.VARIANT }}
          cache-to: type=gha,mode=max,scope=${{ env.VARIANT }}

      - run: tests/smoke.sh local/php:test "${{ steps.version.outputs.php_version }}"

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PHP_VERSION: ${{ needs.test.outputs.php_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/php
          tags: type=raw,value=${{ env.PHP_VERSION }}-${{ env.VARIANT }}
          labels: |
            org.opencontainers.image.title=php-release-bridge ${{ env.PHP_VERSION }}-${{ env.VARIANT }}
            org.opencontainers.image.description=Unofficial, community-built PHP ${{ env.PHP_VERSION }} FPM image on Debian 13 (Trixie). Not affiliated with PHP or Docker.
            org.opencontainers.image.version=${{ env.PHP_VERSION }}
          annotations: |
            org.opencontainers.image.description=Unofficial, community-built PHP ${{ env.PHP_VERSION }} FPM image on Debian 13 (Trixie). Not affiliated with PHP or Docker.

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ env.VARIANT }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/php
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Test pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/php@${DIGEST}"
          tests/smoke.sh "$image" "$PHP_VERSION"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/php@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
